<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Synthetic Hart family archival collage</title>
  <desc id="desc">A fictional warm editorial collage of six abstract family portraits, paper records, botanical branches, and a winding family line.</desc>
  <metadata>Clearly synthetic demo artwork. No real people, photographs, documents, signatures, or historical records are represented.</metadata>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8F2E4"/>
      <stop offset="1" stop-color="#E8D9BE"/>
    </linearGradient>
    <linearGradient id="wash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#20352F"/>
      <stop offset="1" stop-color="#405240"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
