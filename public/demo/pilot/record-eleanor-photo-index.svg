      <text y="172" fill="#3E3A34" font-family="'Courier New', monospace" font-size="15">Walter Hart · June Mercer Hart</text>
      <text y="197" fill="#3E3A34" font-family="'Courier New', monospace" font-size="15">Eleanor Hart West</text>
