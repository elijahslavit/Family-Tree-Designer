<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" role="img" aria-labelledby="title desc">
  <title id="title">Synthetic Eleanor Hart West photograph index record preview</title>
  <desc id="desc">A fictional archive index card documenting a family porch photograph, with an abstract thumbnail, catalog fields, and visible demo-record label.</desc>
  <metadata>Clearly synthetic demo record. The index card, photograph, handwriting, names, dates, identifiers, locations, and descriptions are fictional.</metadata>
  <defs>
    <linearGradient id="desk-index" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#B99068"/><stop offset="1" stop-color="#765844"/></linearGradient>
    <linearGradient id="card-index" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#FAF4E6"/><stop offset="1" stop-color="#E7D8B9"/></linearGradient>
    <filter id="shadow-index" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="17" stdDeviation="18" flood-color="#26352F" flood-opacity=".27"/></filter>
    <clipPath id="thumb-index"><rect x="0" y="0" width="252" height="222" rx="3"/></clipPath>
  </defs>
  <rect width="1000" height="700" fill="url(#desk-index)"/>
  <path d="M0 182h1000M0 474h1000" stroke="#4D392E" stroke-width="3" opacity=".22"/>
