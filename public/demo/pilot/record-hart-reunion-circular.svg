<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" role="img" aria-labelledby="title desc">
  <title id="title">Synthetic Hart reunion circular record preview</title>
  <desc id="desc">A fictional 1958 family reunion circular rendered as an aged typed page with a small porch illustration and visible demo-record label.</desc>
  <metadata>Clearly synthetic demo record. All names, dates, language, marks, addresses, and events are fictional and have no evidentiary value.</metadata>
  <defs>
    <linearGradient id="paper-circular" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F8F0DC"/><stop offset="1" stop-color="#E7D5B4"/></linearGradient>
    <filter id="shadow-circular" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#26362E" flood-opacity=".24"/></filter>
    <pattern id="speckle-circular" width="29" height="29" patternUnits="userSpaceOnUse"><circle cx="4" cy="8" r="1.1" fill="#826F55" opacity=".12"/><circle cx="22" cy="20" r=".8" fill="#826F55" opacity=".1"/></pattern>
  </defs>
  <rect width="1000" height="700" fill="#283B34"/>
  <path d="M0 570c173-71 295-50 420 2 155 65 283 75 580-20v148H0Z" fill="#354C42"/>
  <g transform="translate(120 44) rotate(-1 380 305)" filter="url(#shadow-circular)">
    <rect width="760" height="612" rx="5" fill="url(#paper-circular)"/>
    <rect width="760" height="612" rx="5" fill="url(#speckle-circular)"/>
    <path d="M61 42h638" stroke="#B56B4D" stroke-width="3"/>
    <text x="380" y="81" text-anchor="middle" fill="#26362E" font-family="Georgia, 'Times New Roman', serif" font-size="31" letter-spacing="3">THE HART FAMILY CIRCULAR</text>
    <text x="380" y="108" text-anchor="middle" fill="#796B58" font-family="'Courier New', monospace" font-size="14" letter-spacing="2">NUMBER FOUR · SUMMER 1958 · FICTIONAL DEMO</text>
    <path d="M61 126h638" stroke="#A99980" stroke-width="1"/>

    <g transform="translate(68 155)">
      <text fill="#403B34" font-family="'Courier New', monospace" font-size="16">
        <tspan x="0" y="0">Dear cousins,</tspan>
        <tspan x="0" y="31">The porch tables are reserved for Saturday, the ninth of August.</tspan>
        <tspan x="0" y="57">Bring one photograph with a name on the back and one story you</tspan>
        <tspan x="0" y="83">hope the youngest cousins will remember. We will gather at noon.</tspan>
        <tspan x="0" y="125">Walter is bringing the cedar chest. Eleanor has promised to label</tspan>
        <tspan x="0" y="151">the snapshots before supper, and Samuel will print extra copies of</tspan>
        <tspan x="0" y="177">the family list for anyone beginning a branch notebook.</tspan>
      </text>
    </g>

    <g transform="translate(68 378)">
      <rect width="285" height="139" rx="3" fill="#D8C4A3" opacity=".62"/>
      <path d="M22 112h240M42 112V62h198v50M69 62V35h144v27M91 112V83h32v29M154 112V76h43v36" fill="none" stroke="#655E51" stroke-width="4"/>
      <path d="M16 122c70-15 187-15 253 0" fill="none" stroke="#9A6149" stroke-width="3"/>
      <circle cx="64" cy="47" r="13" fill="#B36B4D" opacity=".45"/>
      <text x="142" y="134" text-anchor="middle" fill="#5C554A" font-family="Georgia, serif" font-size="12" font-style="italic">The Meridian Street porch</text>
    </g>

    <g transform="translate(390 384)" fill="#403B34" font-family="'Courier New', monospace" font-size="15">
      <text x="0" y="0" font-weight="700">PLEASE BRING</text>
      <text x="0" y="31">— one labeled photograph</text>
      <text x="0" y="57">— a remembered saying</text>
      <text x="0" y="83">— a dish for the long table</text>
      <text x="0" y="125">With affection,</text>
      <text x="0" y="154" fill="#8E5545" font-family="Georgia, serif" font-size="25" font-style="italic">June Mercer Hart</text>
    </g>

    <rect x="59" y="549" width="642" height="34" rx="17" fill="#26362E" opacity=".94"/>
    <text x="380" y="571" text-anchor="middle" fill="#F7ECD7" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="3">SYNTHETIC DEMO RECORD · NOT HISTORICAL EVIDENCE</text>
  </g>
</svg>
